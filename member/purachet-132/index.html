<audio id="myAudio" src="music/Desktop 2026.02.18 - 11.21.02.02.mp3" loop></audio>

<script>
        const btn = document.getElementById('play-btn');
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('myAudio');

        btn.addEventListener('click', function() {
            // 1. เล่นเพลง
            audio.play().catch(error => console.log("Autoplay บล็อกอยู่:", error));

            // 2. ทำให้ Overlay ค่อยๆ จางลง
            overlay.style.opacity = '0';

            // 3. รอให้จางจนจบ (0.8วินาทีตาม CSS) แล้วลบออกจากการมองเห็นทั้งหมด
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 800);
        });
    </script>
